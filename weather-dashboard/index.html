<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>🌤️ Weather Dashboard</h1>
            <p class="tagline">Know your weather, plan your day!</p>
        </header>

        <!-- Search Section -->
        <div class="search-section">
            <input 
                type="text" 
                id="searchInput" 
                class="search-box" 
                placeholder="Search for a city..."
                autocomplete="off"
            >
            <button id="searchBtn" class="search-btn">
                <i class="fas fa-search"></i> Search
            </button>
        </div>

        <!-- Error Message -->
        <div id="error" class="error-message"></div>

        <!-- Loading Spinner -->
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Fetching weather data...</p>
        </div>

        <!-- Main Weather Card -->
        <div id="weatherCard" class="weather-card hidden">
            <div class="card-header">
                <div class="city-info">
                    <h2 id="cityName"></h2>
                    <p id="currentDate"></p>
                </div>
                <div class="weather-icon-large">
                    <i id="weatherIcon" class="fas fa-cloud-sun"></i>
                </div>
            </div>

            <div class="temperature-section">
                <div class="temp">
                    <span id="temperature" class="temp-value"></span>
                    <span class="temp-unit">°C</span>
                </div>
                <div class="feels-like">
                    <p>Feels like <span id="feelsLike"></span>°C</p>
                </div>
            </div>

            <div class="weather-description">
                <p id="description"></p>
            </div>

            <!-- Quick Stats -->
            <div class="quick-stats">
                <div class="stat-box">
                    <i class="fas fa-droplet"></i>
                    <div class="stat-info">
                        <p class="stat-label">Humidity</p>
                        <p class="stat-value" id="humidity">--</p>
                    </div>
                </div>
                <div class="stat-box">
                    <i class="fas fa-wind"></i>
                    <div class="stat-info">
                        <p class="stat-label">Wind Speed</p>
                        <p class="stat-value" id="windSpeed">--</p>
                    </div>
                </div>
                <div class="stat-box">
                    <i class="fas fa-compress"></i>
                    <div class="stat-info">
                        <p class="stat-label">Pressure</p>
                        <p class="stat-value" id="pressure">--</p>
                    </div>
                </div>
                <div class="stat-box">
                    <i class="fas fa-eye"></i>
                    <div class="stat-info">
                        <p class="stat-label">Visibility</p>
                        <p class="stat-value" id="visibility">--</p>
                    </div>
                </div>
            </div>

            <!-- UV Index & Air Quality -->
            <div class="extra-info">
                <div class="info-box uv-box">
                    <i class="fas fa-sun"></i>
                    <div>
                        <p class="info-label">UV Index</p>
                        <p class="info-value" id="uvIndex">--</p>
                    </div>
                </div>
                <div class="info-box aqi-box">
                    <i class="fas fa-leaf"></i>
                    <div>
                        <p class="info-label">Air Quality</p>
                        <p class="info-value" id="aqi">--</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 5-Day Forecast -->
        <div id="forecastSection" class="forecast-section hidden">
            <h3>📅 5-Day Forecast</h3>
            <div class="forecast-container" id="forecast"></div>
        </div>

        <!-- Hourly Weather -->
        <div id="hourlySection" class="hourly-section hidden">
            <h3>⏰ Hourly Weather</h3>
            <div class="hourly-container" id="hourly"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
